# Tach: declarative dependency contract for the aroc package.
#
# Enforces:
#   1. Layered: shared depends on nothing; infrastructure depends only
#      on shared; BCs depend on shared + infrastructure (+ any sibling
#      aggregate kernels they NAME); api depends on every BC.
#      `aroc.shared` is the pure-value-object foundation (identifier
#      value objects, identity aliases, bounded-text validators, JSON
#      Schema helpers); `aroc.infrastructure` is composition root,
#      adapters, ports, and event-sourcing machinery.
#   2. Cross-BC: a BC may only reach into a sibling BC through that
#      sibling's `aggregates.*` namespace (the read-side public
#      surface). Never through `features.*` (sibling slice handlers).
#   3. Aggregate kernels are leaf modules with their own dependency
#      whitelist, so cross-BC deps target `aroc.X.aggregates`
#      specifically and `aroc.X.features` is implicitly forbidden
#      to outsiders.
#
# Cross-slice independence inside a BC and slice file contracts are
# enforced by `tests/architecture/` (AST-based) rather than tach,
# because per-slice module declarations would balloon this file.
#
# What this file does NOT say, because the distinction misleads readers:
#
# It constrains IMPORTS. Naming is one of several ways one BC comes to
# depend on another, and the rest leave no import to constrain:
#
#   - A Protocol in `aroc.infrastructure.ports`, implemented by one BC's
#     adapter and consumed by another. Both sides name only
#     `aroc.infrastructure`, which every module does, so no edge appears
#     here even though the dependency is real.
#   - An event subscription, which names its producer with a STRING.
#   - Anything under `tests`, which `exclude` drops entirely.
#
# So read this as the doors that have been cut, not as a map of what
# depends on what. Where the two differ, the map is the larger one.
#
# `tests/architecture/test_tach_edges_are_used.py` fails on an entry no
# source file takes up, so a permission whose reason has gone away does
# not quietly stay.
#
# Run: `uv run tach check` (also wired into pre-commit and CI).
# Visualize: `uv run tach show` opens the dependency graph.

exclude = ["tests", "**/__pycache__", ".venv", "build", "dist"]
source_roots = ["src"]

# Shared kernel: pure value objects and helpers with zero `aroc.*`
# imports. Adapter-free and side-effect-free. Importable from every
# BC and from `aroc.infrastructure`. Modules that depend on ports,
# the kernel, or adapters belong in `aroc.infrastructure`, not here.
[[modules]]
path = "aroc.shared"
depends_on = []

# Infrastructure: composition root, adapters, ports, event-sourcing
# machinery, and cross-cutting concerns. May reach down into
# `aroc.shared`.
#
# The Kernel data class lives in `aroc.infrastructure.kernel` and carries
# zero BC imports, so every BC's wire / handler / route can import it
# without transitively pulling in another BC. Anything that needs a BC to
# build it (the authorize factory, for one) is injected into
# `build_kernel` by the composition root instead.
[[modules]]
path = "aroc.infrastructure"
depends_on = ["aroc.shared"]

# API layer: composition root and the FastAPI/MCP app. Depends on every
# BC, so each new BC adds itself here.
[[modules]]
path = "aroc.api"
depends_on = ["aroc.shared", "aroc.infrastructure", "aroc.access", "aroc.authority"]

# Bounded contexts go below, two entries each:
#
#   [[modules]]
#   path = "aroc.<bc>.aggregates"
#   depends_on = ["aroc.infrastructure"]
#
#   [[modules]]
#   path = "aroc.<bc>"
#   depends_on = ["aroc.infrastructure", "aroc.<bc>.aggregates"]
#
# Declare an edge only once something imports it. A permission nothing
# takes up fails `test_every_declared_dependency_edge_is_taken_up_by_an_import`,
# so "aroc.shared" belongs here only when the BC actually imports from it.
# This template used to list it by default and the first BC to copy the
# template would have failed CI on its first run.
#
# A BC that legitimately reads a sibling's read-side surface adds
# "aroc.<sibling>.aggregates" to the second entry, never the first, and
# never the sibling's bare package path.

# Access BC: identity. `aggregates` is the read-side surface a sibling BC
# may reach into; the package itself re-exports it and nothing more yet.
[[modules]]
path = "aroc.access.aggregates"
depends_on = ["aroc.infrastructure"]

[[modules]]
path = "aroc.access"
depends_on = ["aroc.shared", "aroc.infrastructure", "aroc.access.aggregates"]

# Authority BC: authorization. Holds the Policy aggregate, the rulebook a
# deployment authorizes against.
[[modules]]
path = "aroc.authority.aggregates"
depends_on = ["aroc.shared", "aroc.infrastructure"]

[[modules]]
path = "aroc.authority"
depends_on = [
    "aroc.shared",
    "aroc.infrastructure",
    "aroc.authority.aggregates",
    "aroc.access.aggregates",
]

# The one cross-BC door, and how wide it is.
#
# `PolicyAuthorize` will not authorize a principal Access does not hold an
# active actor for, so Authority reads two names out of Access and nothing
# else. `visibility` scopes this interface to Authority alone: Access's own
# slices keep the whole package, which they need, because a decider and its
# events and its fold all live under here.
#
# One name. The set is read off what the consumer imports, which is the only
# way to size a public surface honestly, and the first draft of this block
# exposed `Actor` as well: the adapter reads `.active` off what `load_actor`
# returns and never names the type, so that entry was a door held open for
# nobody. `test_tach_edges_are_used.py` caught it and is what keeps the
# claim true.
#
# What is deliberately absent is the reason for the block at all. `fold` and
# the event classes are exported from that package because Access's own
# slices need them, and a sibling holding them could build an
# ActorDeactivated and append it, going around the decider that refuses
# deactivating an actor twice. The edge above does not prevent that; this
# does.
[[interfaces]]
from = ["aroc.access.aggregates"]
expose = ["actor.load_actor"]
visibility = ["aroc.authority"]
