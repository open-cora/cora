site_name: Thinker
site_description: Proposes what to run next.
repo_url: https://github.com/open-cora/thinker
repo_name: open-cora/thinker
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/theme.css

extra_javascript:
  - javascripts/hero-fade.js

extra:
  hero:
    masthead: Thinker
    tagline: Metis, goddess of wise counsel
    image: assets/hero-thinker-3600.webp
    srcset: "assets/hero-thinker-1200.webp 1200w, assets/hero-thinker-2400.webp 2400w, assets/hero-thinker-3600.webp 3600w"
    image_alt: >-
      Cumaean Sibyl, by Angelica Kauffman after Domenichino, about 1763: a seated woman holding an unrolled inscribed scroll.
    credit: Angelica Kauffman · Cumaean Sibyl · National Museum of Women in the Arts
    credit_url: https://artsandculture.google.com/asset/cumaean-sibyl-after-domenichino-angelica-kauffman/aQGmLkuxZZ3kZg?hl=en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Reference:
      - Thinking: thinking.md
      - Architecture: architecture.md
      - Client contract: client-contract.md
      - Conventions: conventions.md
      - Glossary: glossary.md
