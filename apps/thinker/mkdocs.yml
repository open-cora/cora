site_name: Thinker
site_description: Suggests what to run next.
repo_url: https://github.com/open-cora/thinker
repo_name: open-cora/thinker
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/theme.css

extra_javascript:
  - javascripts/hero-fade.js

extra:
  hero:
    masthead: Thinker
    align: right
    tagline: Reads the whole chart, then looks up with one thing to say.
    image: assets/hero-thinker-3600.webp
    srcset: "assets/hero-thinker-1200.webp 1200w, assets/hero-thinker-2400.webp 2400w, assets/hero-thinker-3600.webp 3600w"
    image_alt: >-
      The Geographer, by Johannes Vermeer, 1669: a man leaning over a chart with dividers in one hand, looking up and away from the work toward the window.
    credit: Johannes Vermeer · The Geographer · Städel Museum
    credit_url: https://sammlung.staedelmuseum.de/en/work/the-geographer

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Running one: running.md
  - Understanding it:
      - Thinking: thinking.md
      - Architecture: architecture.md
      - Contract: client-contract.md
      - Glossary: glossary.md
  - Changing it:
      - Naming: naming.md
      - Conventions: conventions.md
      - Workflow: workflow.md
