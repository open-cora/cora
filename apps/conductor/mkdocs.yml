site_name: Conductor
site_description: Runs the work at the beamline.
repo_url: https://github.com/open-cora/conductor
repo_name: open-cora/conductor
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/theme.css

extra_javascript:
  - javascripts/hero-fade.js

extra:
  hero:
    masthead: Conductor
    tagline: One boat in the chamber, and never both gates at once.
    image: assets/hero-conductor-2669.webp
    srcset: "assets/hero-conductor-1200.webp 1200w, assets/hero-conductor-2000.webp 2000w, assets/hero-conductor-2669.webp 2669w"
    image_alt: >-
      The Lock, by John Constable, 1824: a lock keeper in a red waistcoat throwing his weight against the balance beam while a barge waits in the water beside him.
    credit: John Constable · The Lock, 1824 · Wikimedia Commons
    credit_url: https://commons.wikimedia.org/wiki/File:John_Constable_-_The_Lock.jpg

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Reference:
      - Conducting: conducting.md
      - Contract: client-contract.md
      - Conventions: conventions.md
      - Glossary: glossary.md
