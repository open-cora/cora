[project]
name = "conductor"
version = "0.1.0"
description = "Walks a procedure across a beamline's seams, one claim at a time"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Doga Gursoy" }]
license = { text = "Apache-2.0" }

# The core has none, and the absence is the design rather than an early
# state: every module above `conductor.epics_control` takes a seam shaped
# like the verbs it uses, so which control library a deployment runs is a
# choice it makes at its entrypoint.
dependencies = []

# An adapter's library is an extra for the same reason. Installing this
# package to drive a Tango beamline should not drag in Channel Access, and
# `conductor.epics_control` is the only module that imports the name below.
[project.optional-dependencies]
epics = ["pyepics>=3.5,<4"]
# Running this as a process, rather than importing it as a library. Only
# `__main__` needs it: `conductor.adapters.keeper_http` writes out the shape of a
# client and takes one, so composing and walking a procedure costs no HTTP
# library at all.
service = ["httpx>=0.28,<1"]

# Pinned to the same ranges as apps/api and apps/reporter. Three projects
# linting under three ruff versions is a drift source with no upside.
[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.1,<0.17",
    "pyright>=1.1.411,<2",
    # The control adapter is checked against a soft IOC rather than a double,
    # for the reason the spikes give: an imitation that was lenient about the
    # thing under test would answer the question by construction. caproto
    # serves Channel Access from Python, so this needs no EPICS installation.
    "caproto>=1.3,<2",
    "pyepics>=3.5,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]

# Copied from apps/reporter rather than shared, for the reason its own
# comment gives: two projects that build and ship separately should not
# fail each other's CI over a style bump.
[tool.ruff]
line-length = 100
target-version = "py313"
# `typings` is deliberately absent. It holds a stub for a third-party
# package, and listing it here would make isort file `epics` as
# first-party. The lint lane still passes the directory as a path.
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "N",    # pep8-naming
    "ASYNC",
    # Documentation guardrails (see docs/reference/conventions.md#documentation).
    "D200",     # one-line docstring fits on one line
    "D201",     # no blank lines before docstring
    "D202",     # no blank lines after function docstring
    "D210",     # no whitespace surrounding docstring text
    "D211",     # no blank lines before class docstring
    "D212",     # multi-line summary on the first line (vs D213)
    "D300",     # triple double quotes
    "D403",     # first word capitalized
    "D404",     # first word not "This"
    "D415",     # first line ends with .  ?  or !
    # TODO hygiene: git log and the PR description carry context, not source.
    "TD002",    # require TODO author
    "TD003",    # require TODO issue link
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["conductor", "tests"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "channel_access: needs the soft IOC, so it talks over a real CA socket",
]
