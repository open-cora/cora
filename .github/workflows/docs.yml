name: Docs

# Pages is enabled with the "GitHub Actions" source. The site rebuilds on every
# push to main; workflow_dispatch is kept so a deploy can be forced without a
# commit.
#
# This builds the tree's own site and nothing else. `make docs-build` also
# builds each project's, but those travel with the projects and are deployed
# from the repositories they are published to, one Pages site per repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # uv rather than pip, so the build runs the Makefile's own target and the
      # theme pin has one home. Installing the theme here instead would put the
      # version in two places, and the day they drift is the day a reader's site
      # renders differently from `make docs-serve`.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make tree-docs-build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
