repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Syntax-only parse so a future mkdocs.yml's !!python/name tags
        # do not fail the safe loader. Does not execute constructors.
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Order matters: check (with --fix) before format.
      #
      # The alternation names every app, and it is load-bearing rather than
      # tidy: this pattern spelled a directory that had been renamed, so it
      # matched none of the keeper's 538 lintable files and reported success
      # on every commit. A `files:` pattern that matches nothing is
      # indistinguishable from a clean tree, so renaming an app directory
      # means editing this line in the same commit.
      - id: ruff-check
        args: [--fix]
        files: ^(apps/(keeper|reporter|conductor)/(src|tests|typings)|tests|beamlines)/
      - id: ruff-format
        files: ^(apps/(keeper|reporter|conductor)/(src|tests|typings)|tests|beamlines)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Local hooks so each tool runs against the project's uv venv and sees
  # the same dependencies and source tree pytest does.
  - repo: local
    hooks:
      - id: pyright
        name: pyright (apps/keeper)
        entry: bash -c 'cd apps/keeper && uv run pyright src tests'
        language: system
        pass_filenames: false
        files: ^apps/keeper/(src|tests)/.+\.py$

      # A second hook rather than a widened one: the reporter has its own
      # virtualenv and its own pyright settings, so one invocation cannot
      # cover both trees.
      - id: pyright-reporter
        name: pyright (apps/reporter)
        entry: bash -c 'cd apps/reporter && uv run pyright src tests'
        language: system
        pass_filenames: false
        files: ^apps/reporter/(src|tests|typings)/.+\.pyi?$

      # A third, for the third project. Same reason as the second: its own
      # virtualenv, its own pyright settings, and `typings` in scope because
      # it carries a stub for the control library.
      - id: pyright-conductor
        name: pyright (apps/conductor)
        entry: bash -c 'cd apps/conductor && uv run pyright src tests'
        language: system
        pass_filenames: false
        files: ^apps/conductor/(src|tests|typings)/.+\.pyi?$

      # The tree's own, for what belongs to no project. A fourth pyright
      # invocation for the same reason there are three: its own virtualenv and
      # its own settings, so one call cannot cover another's tree.
      - id: pyright-tree
        name: pyright (the tree)
        entry: bash -c 'uv run pyright tests beamlines'
        language: system
        pass_filenames: false
        files: ^(tests|beamlines)/.+\.py$

      - id: tree-tests
        name: cross-cutting rules and beamline descriptors
        entry: bash -c 'uv run pytest -q'
        language: system
        pass_filenames: false
        # Prose too: these rules read the root pages, the CORA site and the
        # beamline prose, so a change to any of them is what has to re-run them.
        files: ^(tests|beamlines|docs)/.+|^[A-Z]+\.(md|cff)$

      # Tach: declarative dependency contract. Config at apps/keeper/tach.toml.
      - id: tach-check
        name: tach check (apps/keeper)
        entry: bash -c 'cd apps/keeper && uv run tach check'
        language: system
        pass_filenames: false
        files: ^apps/keeper/(src/keeper/.+\.py|tach\.toml)$

      # Architecture fitness functions: AST and filesystem checks tach
      # cannot express (slice file contract, decider purity, wire
      # completeness). Fast, run on every Python change.
      - id: arch-tests
        name: architecture fitness functions (apps/keeper)
        entry: bash -c 'cd apps/keeper && uv run pytest tests/architecture -q'
        language: system
        pass_filenames: false
        files: ^apps/keeper/(src/keeper/.+\.py|tests/architecture/.+\.py)$

      # ----------------------------------------------------------------
      # Pre-push only: full-tree ruff check + format, matching CI exactly.
      #
      # The ruff-pre-commit hooks above run against STAGED files only, so
      # unstaged drift can slip past pre-commit and trip CI on push. These
      # run against the whole tree at push time so the same violations CI
      # would catch are caught one round-trip earlier.
      #
      # Install with: pre-commit install --hook-type pre-push
      # (one-shot per clone; idempotent if already installed).
      # ----------------------------------------------------------------
      - id: ruff-check-all
        name: ruff check (full tree, matches CI)
        entry: bash -c 'cd apps/keeper && uv run ruff check src tests'
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: ruff-format-check-all
        name: ruff format --check (full tree, matches CI)
        entry: bash -c 'cd apps/keeper && uv run ruff format --check src tests'
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: reporter-gate-all
        name: reporter lint, typecheck and test (matches CI)
        entry: bash -c 'cd apps/reporter && uv run ruff check src tests typings && uv run ruff format --check src tests typings && uv run pyright src tests && uv run pytest -q'
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      # The conductor's core suite only. Its Channel Access tests drive a
      # soft IOC through real motion and take about eighty seconds, which is
      # a fine price for a CI lane and not one to pay on every push. CI runs
      # the marker; see the conductor job in ci.yml.
      - id: conductor-gate-all
        name: conductor lint, typecheck and core test (matches CI)
        entry: bash -c 'cd apps/conductor && uv run ruff check src tests typings && uv run ruff format --check src tests typings && uv run pyright src tests && uv run pytest -q -m "not channel_access"'
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
