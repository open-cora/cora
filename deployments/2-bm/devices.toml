# The 2-BM device register.
#
# Every row is one record AROC will hold: where the control system
# publishes it, and this system's own label for it. Three keys and no
# others; deployments/README.md says why the fields a beamline drawing
# would carry are not among them.
#
# A ref is already in normal form here, and the loader refuses one that is
# not: trimmed, cut at the first '.', no trailing ':'. So 2bmb:m1.RBV is
# written 2bmb:m1, and 2bmb:m1 and 2bmb:m10 are two motors.
#
# confirmed = true means the row was checked against the beamline. Rows
# start false and are promoted when staff or a caget sweep says so. It is
# not a defect to be false; it is a defect to be false and say true.
#
#   [[device]]
#   ref = "2bmb:m1"
#   name = "Sample rotation"
#   confirmed = false

scheme = "epics-record"

# No devices yet. The rows come from a caget sweep against 2-BM's own IOCs
# or from staff, and nothing here is transcribed from anywhere else, so the
# file stays empty until somebody has run one. deployments/tests pins this
# count at zero so an empty register cannot be mistaken for a checked one.
