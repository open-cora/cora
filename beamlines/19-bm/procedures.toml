# The 19-BM procedure register.
#
# A procedure is a routine composed here, over this beamline's records. It
# is the per-beamline thing an operation is not: beamlines/operations.toml
# holds the engine's word, and a run step below names it.
#
# The file names its beamline once, at the top, and it is the same word as
# the directory, which is also what the keeper routes a dispatch by.
#
# ## confirmed, and why it does not mean here what it means next door
#
# In devices.toml, `confirmed` is a claim about evidence and an unconfirmed
# row is registered anyway. Here it is a gate: **an unconfirmed procedure is
# never seeded.** It stays in this file and the keeper never holds it.
#
# The reason is that a procedure is dispatchable and a device is not. A
# drafted routine claiming real records, sitting in the record, is one
# dispatch away from moving something. Nothing can dispatch what the keeper
# does not hold, so the gate is structural rather than a thing to remember.
#
# That matters more than usual because a procedure cannot be taken back. The
# keeper can retire one, which stops its dispatch, but retiring deletes
# nothing, so whatever is seeded is in the facility's record permanently.
#
# ## Two rows, one name
#
# Both rows are the same routine. The confirmed one claims the simulator
# this beamline serves; the unconfirmed one records what the same routine
# would claim against the hardware. When the beamline confirms the second,
# it replaces the first rather than joining it.
#
# A name is this system's own label, so it carries no beamline, no mention
# of the simulator and no ordinal.
#
# ## The confirmed row claims the simulator and no longer drives it
#
# This said that a row's scopes make readable "which of those a row
# drives", which was wrong, and the way it was wrong is worth keeping.
#
# Scopes say what a row claims. What it drives is the engine's
# `run.prefix`, which lives in the conductor's configuration on the host
# and not here. On 20261103 the 19-BM conductor was repointed from
# `corasim19bm:TomoScan:` to `19bm:TomoScan:`, and the row below was not
# touched, because nothing connects the two.
#
# Nothing refuses the result either. `control.writable` is handed to the
# conductor's control adapter and fences set steps; a run step's scopes
# are compared to nothing at all. A claim is a ledger lock against
# another walk in the same process, not a fence on the engine. So this
# row takes a claim on a simulator nothing is running, and scans the
# station.
#
# beamlines/verify_hosts.py reports it, in those words, and reported it
# as "that step is refused" until the check was rewritten. Running it is
# how a repoint gets noticed; nothing at runtime will say anything.
#
# ## What a run step has to declare, and why
#
# `scopes` is required and must name at least one record or namespace.
# Nothing in this system can look inside a routine to work out what it will
# drive, so a step declaring nothing would be one this system believes
# touches nothing, which is precisely the undeclared scan a rival writer
# corrupts.
#
# The parameters are a smoke-test size chosen here. They are not a
# measurement and not this beamline's own setting.
#
# ## What the hardware row claims, and the two axes it cannot
#
# One record, and the shortness is the point.
#
# The acquisition software here names three axes and only one of them
# exists. Asked for its sample translations it returns `TODO_SAMPLE_X` and
# `TODO_SAMPLE_Y`, because the beamline is in commissioning and nobody has
# filled them in. devices.toml holds that story and holds neither string.
#
# So a tomography scan here can turn the sample and cannot move it clear of
# the beam, which is what a flat field needs. The row below is honest about
# that by claiming only what answers. It is not a routine anybody should run
# for data, and `confirmed = false` is doing its job: this is a draft of
# what the beamline would claim once it has axes to claim, not a routine
# waiting for permission.
#
# The hexapod base Y in devices.toml is deliberately not here. It carries
# the assembly rather than the sample, and the beamline warns against
# binding one to the other because the names invite it and the images would
# be wrong before anything else complained.
#
# The detector is absent for the reason it is absent everywhere here: it is
# named as a prefix, which is a namespace rather than a record.

beamline = "19-bm"

[[procedure]]
name = "Tomography scan"
confirmed = true

  [[procedure.step]]
  kind = "run"
  operation = "tomography_scan"
  scopes = ["corasim19bm:"]
  parameters = { NumAngles = 16, ExposureTime = 0.05 }

[[procedure]]
name = "Tomography scan"
confirmed = false

  [[procedure.step]]
  kind = "run"
  operation = "tomography_scan"
  scopes = ["19bmSoft:aero:m1"]
  parameters = { NumAngles = 16, ExposureTime = 0.05 }

# ## The same scan, collected with a setup
#
# The pair below is the pair above written with `collect`. The settings
# are the setup smoke-19bm in collection.toml rather than values on the
# step, and the claims are the same two, for the same reasons. The name
# differs because a row resolves by its name and what it claims, so a
# collect row named like the pair above would resolve as already defined
# and never be seeded.
#
# The confirmed row runs once this beamline's conductor collects and is
# pointed at the simulator, which is how collect is proven here, and is
# refused while it drives the station, as the confirmed row above is. When
# 19-BM's conductor switches to collect, the pair above is retired.

[[procedure]]
name = "Smoke-test scan"
confirmed = true

  [[procedure.step]]
  kind = "run"
  operation = "collect"
  scopes = ["corasim19bm:"]
  parameters = { config = "smoke-19bm" }

[[procedure]]
name = "Smoke-test scan"
confirmed = false

  [[procedure.step]]
  kind = "run"
  operation = "collect"
  scopes = ["19bmSoft:aero:m1"]
  parameters = { config = "smoke-19bm" }

# The first routine here that would drive real hardware, and the smallest
# one that can. Two sets against the rotation stage, out to five degrees
# and back to zero.
#
# ## Why a set and not the scan above
#
# It was the only thing that could run. The engine writes the two keeper
# ids into the acquisition server before it writes anything else, and
# 19bm:TomoScan: served neither: they are added by a deployment and this
# beamline's IOC never was. The adapter refused on the first of them,
# before a parameter was written and before the start.
#
# That is no longer the reason. A bridge IOC runs on the beamline's own
# machine and serves the two records at 19bm:TomoScan:, so both answer
# and the adapter gets past them. What the scan waits on now is the two
# decisions below rather than a missing record.
#
# A set still needs none of that. It writes one record and reads it back,
# which is why it is the smaller thing to dispatch first.
#
# ## Why two steps
#
# The second one is what makes this safe to dispatch more than once.
# Whatever is seeded can be run again by anyone who can dispatch until
# somebody retires it, and one that ends where it started leaves nothing
# to undo. It also walks more than one step, which the simulator
# procedure does not.
#
# Five degrees and zero are not arbitrary. The stage was swept over its
# full working range and its readback characterised, so these two
# positions are inside ground that has been measured rather than assumed.
#
# ## What confirmed = false is holding back
#
# Only this file, and deliberately. Flipping it to true is the act that
# puts a routine claiming a real motor into a record that cannot release
# it. That is a decision for whoever owns the beamline time, not a
# formality, and it is why the word is here rather than inferred.
#
# The conductor also has to allow it. control.writable is the fence a
# step is checked against, and it names the simulator prefix alone
# today, so this step is refused until it names this record too. The
# record is written out in full rather than as a prefix, because the
# check is a prefix match and the shortest fence that admits this motor
# is the motor.
#
# ## What that fence does not cover, which matters for the scan
#
# A step's scopes are a claim and not a fence on the engine. The ledger
# uses them so two conductors cannot drive one axis at once, and nothing
# compares them to the prefix the engine was configured with: that
# prefix is a deployment's fact, the way a transfer's collections are.
#
# So the confirmed row at the top of this file, which claims
# corasim19bm: and is in the keeper now, would start a scan on whatever
# acquisition server its conductor is pointed at. While that conductor
# names the simulator the two agree. Pointing it at 19bm:TomoScan:
# without retiring that row leaves a seeded procedure that reads as a
# simulation and runs on the station.

[[procedure]]
name = "Sample rotation check"
confirmed = false

  [[procedure.step]]
  kind = "set"
  record = "19bmSoft:aero:m1"
  to = 5.0

  [[procedure.step]]
  kind = "set"
  record = "19bmSoft:aero:m1"
  to = 0.0

# ## The rows below are the off-site chain
#
# They move a dataset to a computing facility, process it there, and
# bring the result home. Each says `drives_no_device`, which is the whole
# point: none touches anything at this beamline, and before that could be
# said a run had to name at least one scope, so every candidate would have
# been a fiction kept forever in a record that keeps every procedure,
# retired or not.
#
# ## Why they are at 19-BM when the data is not
#
# A procedure's beamline says which conductor claims it, not whose data
# it is. The mover and the compute engine run in 19-BM's deployment,
# because that is where the credential and the network egress are, so
# these are 19-BM's rows. The dataset is 7-BM Monet data on
# APS:DM:EBERLIGHT, which is the only collection this facility's token
# can currently read: APS:DM:19BM answers ConsentRequired and the
# consent is blocked by Data Management policy rather than by a missing
# click. So this chain proves the mechanism and reconstructs somebody
# else's sample.
#
# ## Why a procedure per leg and not one with three steps
#
# A step hands its work off when it outlives the bound its engine waits
# for, and a handoff stops the walk, because every later step was written
# on the assumption this one finished. A move or a reconstruction can
# outlive its bound, so the legs cannot be one procedure, and chaining
# them is a pursuit opening a round per execution rather than a longer
# list of steps.
#
# ## One spelling for a path at every stop
#
# Every row names a place and a path inside it, and the deployment says
# what a place is. The mover resolves alcf to the 19-BM area of the
# computing facility's collection, and the processor resolves it to the
# same folder as the compute host sees it. For Eagle the two differ by a
# prefix:
#
#     collection  /APSDataAnalysis/imaging/19BM/<path>
#     filesystem  /eagle/APSDataAnalysis/imaging/19BM/<path>
#
# No row carries either, so the path a move lands is the path a process
# reads.
#
# ## Every hop is a move
#
# Moving data was first written as two one-way operations, `transfer` out
# and `retrieve` home, each served by an engine bound to one pair of
# collections. Both are gone. It is now `move`: one engine holding every
# place a deployment named and the routes between them, so a step names a
# path and two places, and a round trip is two steps of one operation. The
# rows that use it are at the end of this file, either side of the row
# that processes.
#
# ## Confirming is what spends
#
# An unconfirmed procedure never reaches the keeper, so nothing can
# dispatch one. Flipping a row is the act that spends an allocation: a
# process row charges real time on a computing facility.

# ## Procedures the record holds and this file no longer does
#
# Each dataset here was first moved by a row running `transfer`, the
# one-way operation `move` replaced: "Move a dataset to the computing
# facility" for the truncated file described below and "Move monet 0006
# to the computing facility" for its sibling. Both stay in the record,
# which deletes nothing, and neither can run, because no conductor answers
# to `transfer` any longer. "Send monet 0006 to the computing facility"
# replaces the second; the first moved the truncated file and has no
# replacement.
#
# Each was then reconstructed by a row running `reconstruct`, the
# operation `process` replaced: "Reconstruct a dataset" and "Reconstruct
# monet 0006". That operation was given a full filesystem path and wrote
# into a folder named after its input. Both rows stay in the record, and
# neither can run, because no conductor answers to `reconstruct` any
# longer.
#
# All four can be retired, and so can the two operations they run.
# Retiring an operation is enough to refuse a dispatch of both its rows,
# where until then one would be recorded and wait forever; retiring the
# rows as well takes them out of what a listing of this beamline offers.
# Until a row is retired beamlines/verify_state.py reports it as
# unexpected, and after, lists it as retired and counts it as nothing.
#
# The first named monet_..._bottom_..._0004.h5, which is 299MB where every
# other scan in that directory is 15.8GB and is the only .h5 under a
# gigabyte among 107 entries. It is a truncated file: the rotation angles
# are written when a scan closes, so tomocupy died in init_sizes reading
# /exchange/theta, twice, in about ninety seconds each. The engine was
# never the problem and neither were the flags. The rows below name its
# sibling, which is whole and has the facility's own reconstruction beside
# it on the source collection, so it is known to reconstruct rather than
# hoped to. The second row reconstructed that sibling on 20261105;
# "Process monet 0006 at the computing facility" replaces it.
#
# ## A procedure per dataset is the wrong shape, and these are hand authored
#
# A procedure's parameters are part of it, and beamlines/seed_procedures.py
# resolves a row by its name and what it claims rather than by what it
# carries, so repointing a row resolves as already defined and seeds
# nothing. A procedure per dataset does not scale past a demonstration,
# and the keeper already has the answer: compose_one_run mints a one step
# procedure around an operation and its parameters, per run, which is what
# the agent-driven path uses. These rows are hand authored because nothing
# is proposing yet.
#
# ## The chain
#
# This beamline's conductor holds the mover, with two places and one
# route, 19-bm to alcf, and the processor, with alcf as its one place and
# tomocupy-19bm, the configuration in processing.toml beside this file, as
# its one configuration. 19-bm is rooted at the top of the collection the
# data is published on, and alcf at the 19-BM area of the computing
# facility's.
#
# The first row lands the file under alcf at the path it had at 19-bm,
# and the second reads it there. The second overrides nothing. Its
# rotation axis is the configuration's, which is the facility's own
# wrapper's default, and rot_cen.json in the source directory suggests
# centres are kept per file. A wrong centre blurs a volume rather than
# failing, so what this row tests is the machinery and not the image.
#
# A reconstruction is a folder and not one file: 800 recon_NNNNN.tiff of
# about 42MB each, a logs directory and a rec_line.txt. A process step
# names its folder, so the name in the last row is copied from the row
# before it, and its trailing slash is what makes it a folder. It ends in
# _rec, the suffix the facility gives its own reconstructions, and the
# processor refuses an output folder that already holds anything.
#
# The first two rows are confirmed and the last is not. Nothing has a
# route home yet: the only collection this facility's token reads is the
# one the data came from, so no destination at 19-bm is verified as
# writable, and a row whose route is missing would be refused by the
# conductor at the first step rather than here.

[[procedure]]
name = "Send monet 0006 to the computing facility"
confirmed = true

  [[procedure.step]]
  kind = "run"
  operation = "move"
  drives_no_device = true
  parameters = { path = "Monet/7BM/2026-2/Monet_20260609-e300563/data/monet_61806_4_A_robpos1_Sample_middle_prop420_exp0p009_0006.h5", from = "19-bm", to = "alcf" }

[[procedure]]
name = "Process monet 0006 at the computing facility"
confirmed = true

  [[procedure.step]]
  kind = "run"
  operation = "process"
  drives_no_device = true

    [procedure.step.parameters]
    config = "tomocupy-19bm"
    at = "alcf"
    input = "Monet/7BM/2026-2/Monet_20260609-e300563/data/monet_61806_4_A_robpos1_Sample_middle_prop420_exp0p009_0006.h5"
    output = "analysis/results/monet_61806_4_A_robpos1_Sample_middle_prop420_exp0p009_0006_rec/"

[[procedure]]
name = "Bring monet 0006 home"
confirmed = false

  [[procedure.step]]
  kind = "run"
  operation = "move"
  drives_no_device = true
  parameters = { path = "analysis/results/monet_61806_4_A_robpos1_Sample_middle_prop420_exp0p009_0006_rec/", from = "alcf", to = "19-bm" }
