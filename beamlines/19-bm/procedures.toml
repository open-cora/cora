# The 19-BM procedure register.
#
# A procedure is a routine composed here, over this beamline's records. It
# is the per-beamline thing an operation is not: beamlines/operations.toml
# holds the engine's word, and a run step below names it.
#
# The file names its beamline once, at the top, and it is the same word as
# the directory, which is also what the keeper routes a dispatch by.
#
# ## confirmed, and why it does not mean here what it means next door
#
# In devices.toml, `confirmed` is a claim about evidence and an unconfirmed
# row is registered anyway. Here it is a gate: **an unconfirmed procedure is
# never seeded.** It stays in this file and the keeper never holds it.
#
# The reason is that a procedure is dispatchable and a device is not. A
# drafted routine claiming real records, sitting in the record, is one
# dispatch away from moving something. Nothing can dispatch what the keeper
# does not hold, so the gate is structural rather than a thing to remember.
#
# That matters more than usual because a procedure cannot be taken back. The
# keeper has define and dispatch and no retire, so whatever is seeded is in
# the facility's record permanently.
#
# ## Two rows, one name
#
# Both rows are the same routine. The confirmed one drives the simulator
# this beamline serves; the unconfirmed one records what the same routine
# would claim against the hardware. When the beamline confirms the second,
# it replaces the first rather than joining it.
#
# A name is this system's own label, so it carries no beamline, no mention
# of the simulator and no ordinal. Which of those a row drives is readable
# from its scopes, where it is a fact rather than a word.
#
# ## What a run step has to declare, and why
#
# `scopes` is required and must name at least one record or namespace.
# Nothing in this system can look inside a routine to work out what it will
# drive, so a step declaring nothing would be one this system believes
# touches nothing, which is precisely the undeclared scan a rival writer
# corrupts.
#
# The parameters are a smoke-test size chosen here. They are not a
# measurement and not this beamline's own setting.
#
# ## What the hardware row claims, and the two axes it cannot
#
# One record, and the shortness is the point.
#
# The acquisition software here names three axes and only one of them
# exists. Asked for its sample translations it returns `TODO_SAMPLE_X` and
# `TODO_SAMPLE_Y`, because the beamline is in commissioning and nobody has
# filled them in. devices.toml holds that story and holds neither string.
#
# So a tomography scan here can turn the sample and cannot move it clear of
# the beam, which is what a flat field needs. The row below is honest about
# that by claiming only what answers. It is not a routine anybody should run
# for data, and `confirmed = false` is doing its job: this is a draft of
# what the beamline would claim once it has axes to claim, not a routine
# waiting for permission.
#
# The hexapod base Y in devices.toml is deliberately not here. It carries
# the assembly rather than the sample, and the beamline warns against
# binding one to the other because the names invite it and the images would
# be wrong before anything else complained.
#
# The detector is absent for the reason it is absent everywhere here: it is
# named as a prefix, which is a namespace rather than a record.

beamline = "19-bm"

[[procedure]]
name = "Tomography scan"
confirmed = true

  [[procedure.step]]
  kind = "run"
  operation = "tomography_scan"
  scopes = ["corasim19bm:"]
  parameters = { NumAngles = 16, ExposureTime = 0.05 }

[[procedure]]
name = "Tomography scan"
confirmed = false

  [[procedure.step]]
  kind = "run"
  operation = "tomography_scan"
  scopes = ["19bmSoft:aero:m1"]
  parameters = { NumAngles = 16, ExposureTime = 0.05 }

# The first routine here that would drive real hardware, and the smallest
# one that can. Two sets against the rotation stage, out to five degrees
# and back to zero.
#
# ## Why a set and not the scan above
#
# It was the only thing that could run. The engine writes the two keeper
# ids into the acquisition server before it writes anything else, and
# 19bm:TomoScan: served neither: they are added by a deployment and this
# beamline's IOC never was. The adapter refused on the first of them,
# before a parameter was written and before the start.
#
# That is no longer the reason. A bridge IOC runs on the beamline's own
# machine and serves the two records at 19bm:TomoScan:, so both answer
# and the adapter gets past them. What the scan waits on now is the two
# decisions below rather than a missing record.
#
# A set still needs none of that. It writes one record and reads it back,
# which is why it is the smaller thing to dispatch first.
#
# ## Why two steps
#
# The second one is what makes this safe to dispatch more than once. A
# procedure cannot be retired, so whatever is seeded can be run again by
# anyone who can dispatch, and one that ends where it started leaves
# nothing to undo. It also walks more than one step, which the simulator
# procedure does not.
#
# Five degrees and zero are not arbitrary. The stage was swept over its
# full working range and its readback characterised, so these two
# positions are inside ground that has been measured rather than assumed.
#
# ## What confirmed = false is holding back
#
# Only this file, and deliberately. Flipping it to true is the act that
# puts a routine claiming a real motor into a record that cannot release
# it. That is a decision for whoever owns the beamline time, not a
# formality, and it is why the word is here rather than inferred.
#
# The conductor also has to allow it. control.writable is the fence a
# step is checked against, and it names the simulator prefix alone
# today, so this step is refused until it names this record too. The
# record is written out in full rather than as a prefix, because the
# check is a prefix match and the shortest fence that admits this motor
# is the motor.
#
# ## What that fence does not cover, which matters for the scan
#
# A step's scopes are a claim and not a fence on the engine. The ledger
# uses them so two conductors cannot drive one axis at once, and nothing
# compares them to the prefix the engine was configured with: that
# prefix is a deployment's fact, the way a transfer's collections are.
#
# So the confirmed row at the top of this file, which claims
# corasim19bm: and is in the keeper now, would start a scan on whatever
# acquisition server its conductor is pointed at. While that conductor
# names the simulator the two agree. Pointing it at 19bm:TomoScan:
# without retiring that row, which cannot be retired, leaves a seeded
# procedure that reads as a simulation and runs on the station.

[[procedure]]
name = "Sample rotation check"
confirmed = false

  [[procedure.step]]
  kind = "set"
  record = "19bmSoft:aero:m1"
  to = 5.0

  [[procedure.step]]
  kind = "set"
  record = "19bmSoft:aero:m1"
  to = 0.0
