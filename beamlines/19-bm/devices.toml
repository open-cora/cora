# The 19-BM device register.
#
# Every row is one record the keeper will hold: where the control system
# publishes it, and this system's own label for it. Four keys and no
# others, one of them optional; beamlines/README.md says why the fields
# a beamline drawing would carry are not among them.
#
# The file names its beamline once, at the top, and it is the same word
# as the directory. A test compares the two, which is the only place in
# this system where two of the three copies of a beamline's name are
# ever checked against each other.
#
# group is which functional cluster a device belongs to here, and it is
# left out for a device that belongs to none. It is a value rows share
# rather than a thing that owns them: no nesting, no ordering, and
# nothing that can be said about a group rather than about a device.
#
# A ref is already in normal form here, and the loader refuses one that is
# not: trimmed, cut at the first '.', no trailing ':'.
#
# confirmed = true means the row was checked against the beamline. Rows
# start false and are promoted when staff or a caget sweep says so. It is
# not a defect to be false; it is a defect to be false and say true.
#
# ## 23 rows, from two sources that found different things
#
# The acquisition software was asked which records it drives. It names
# three things and all three are now records:
#
#     RotationPVName  ->  19bmSoft:aero:m1      reads -6.5514e-06
#     SampleXPVName   ->  19bmHXP:m1            reads 7
#     SampleYPVName   ->  19bmHXP:m2            reads 0
#
# **The two sample axes used to be placeholders, and the lesson they
# taught is why the read-back rule exists.** Asked the same question
# while the beamline was in commissioning, the software answered
# TODO_SAMPLE_X and TODO_SAMPLE_Y. Neither contains a '.' or a trailing
# ':', so both pass normalization unchanged and the loader would have
# accepted either as a device. A register holding TODO_SAMPLE_X would
# have been well-formed, confirmed by the same technique that confirmed
# everything else here, and completely wrong. What kept them out was
# that the sweep read each reference back and these two answered
# nothing.
#
# That episode is kept rather than deleted, the way the duplicate-server
# reading below is kept, because beamlines/README.md turns the general
# rule on this specific beamline and a reader who meets only the working
# state cannot see what the rule is for. The answers are real today; the
# reason to check them is not weaker for that.
#
# Re-measured 2026-11-03 and the hexapod the two axes name answers:
# 19bmHXP: serves six axes on this beamline's own network. Whether this
# is the unit 7-BM's register holds, relocated, is **not** established
# here. Nothing at 7-BM answered from its own host on the day this was
# written, including records that register confirms, so that measurement
# says nothing about where any hardware is and is not cited as if it did.
#
# The other rows come from the weaker source, and it is worth being
# plain about which is which. Each motor on this IOC was read for its
# description field and its readback, and a row exists here only where
# both answered. So every reference below names a record that replied,
# which is what `confirmed` claims and all it claims.
#
# The description field is not the reference and is not trusted as one:
# beamlines/README.md says it is served empty and writable by anyone.
# What it gives is a role, and the name on each row is authored here from
# that role rather than copied from it.
#
# ## Seven motors answered and are deliberately absent
#
# `m7` and `m8` describe themselves as spare. `m12` through `m16`
# describe themselves by crate and channel, which says where a cable
# lands and not what it moves. Every one of them reads zero and belongs
# to nothing anybody has named.
#
# They are excluded rather than added without a group, because a row
# whose name would have to be invented is the guessing this directory
# exists to avoid. They are recorded here so a later reader knows the
# sweep saw them and made a decision, rather than wondering whether it
# missed them.
#
# **`m19` and `m20` were on that list and have left it.** They described
# themselves by crate and channel and read zero when this register was
# written; they now describe themselves OP_Focus_LowMag and
# OP_Rot_LowMag and read 178.64 and 29.2514. Nothing about the exclusion
# rule changed, only what the records answer, which is the case the rule
# is meant to handle: a row appears when the beamline gives it a role
# rather than when somebody decides what it probably is.
#
# Two hexapod axes are excluded for the same reason. `19bmHXP:m5` and
# `19bmHXP:m6` both describe themselves Hexapod AY, so one of the two
# names is wrong and the sweep cannot tell which. Naming either would be
# inventing the half the beamline did not supply. The duplicate is worth
# reporting to the beamline rather than working around here.
#
# ## What is documented and not here
#
# The facility's own pages describe slits and filters on this beamline's
# motor IOC. The acquisition software does not name them and this sweep
# did not guess at their addresses, so they are absent rather than
# unconfirmed. Writing them from a record number would be the guessing
# this directory exists to avoid.
#
# The detector is named as a prefix, ending in a namespace separator and
# naming no record, which is the same exclusion every other register here
# makes.
#
# ## The ambiguity this file once recorded, and what is there now
#
# These rows were written while two servers were answering this
# beamline's record names, and the paragraph here said so: every
# reference drew a duplicate-server warning from Channel Access and
# answered from a link-local address rather than from a machine anybody
# meant to serve them.
#
# Re-measured from a private host on 2026-10-03 and none of that
# reproduces. One server answers, it is this beamline's own soft IOC
# host, and it serves on the standard port. No duplicate-server warning appears, on the facility broadcast
# list or against that single address pinned:
#
#     19bmSoft:aero:m1   the soft IOC host   22.4088949931
#     19bmSoft:m1        the soft IOC host   9.75
#     19bmSoft:m2        the soft IOC host   2.7004
#     19bmSoft:m23       the soft IOC host   0.0
#
# Every one of those four answers from one server again on 2026-11-03,
# and every one reads a different number, because staff have since
# commissioned and run the instrument. A readback is a position and not
# a property of the register, so the values are recorded here as
# evidence that a server answered and never as something to check
# against.
#
# The earlier reading is kept rather than deleted, because a race
# between two servers is exactly the kind of fault that comes and goes,
# and a reader meeting one here should know it has been seen before. A
# single measurement showing it gone is weaker evidence than a single
# measurement showing it present.
#
# What changed meanwhile is what `confirmed = true` claims. It now means
# both halves: something answered and gave a role, and the name picks
# out one device. While two servers were answering only the first half
# held, and nothing in this file could say so.
#
# Two things measured alongside and not fixed here, because they are
# host configuration and not a register. Both stop a client on the
# routable host reading any record in this file, and both were still
# present on 2026-11-03.
#
# The beamline account's login profile names the right two hosts on port
# 16661, where the servers listen on 5064. The service environment file
# names the soft IOC host as an address that is not it. The service file
# also writes its address list unquoted, which systemd reads as one
# value and a shell does not, so sourcing it in a terminal silently
# leaves the profile's list in place and the two faults look like one.
#
# What makes this survive is that the simulator entries in the same list
# are reachable and answer, so a client looks configured and working
# while no real record is readable through it.
#
# **The hexapod base moved group and not beamline.** 19bmSoft:m23 was in
# sample-stack and is now in sample-base, which 2-BM and 32-ID gained at
# the same time. What stands under the stack is one motor here, a four-axis
# table at 2-BM and a six-axis one at 32-ID, so the group is named for what
# it is for rather than for the mechanism this beamline happens to have.
# That left sample-stack here holding the rotation stage alone while the
# hexapod this beamline was waiting for had not arrived. It has arrived.
# Its four unambiguous axes join sample-stack, which is where 7-BM's
# register puts the same mechanism, and 19bmSoft:m23 stays in
# sample-base because what it carries is unchanged.
#
# The two Y axes are the trap this beamline was already warned about and
# now has in one register. 19bmSoft:m23 is Hexapod_Base_Y and carries
# the assembly; 19bmHXP:m2 is Hexapod Y and is the sample axis the
# acquisition software drives. The names invite binding one to the other
# and the images would be wrong before anything else complained.
#
scheme = "epics-record"
beamline = "19-bm"

[[device]]
ref = "19bmSoft:aero:m1"
name = "Sample rotation"
confirmed = true
group = "sample-stack"

# The four hexapod axes whose descriptions pick out one axis each. They
# come from the strong source: the acquisition software names the first
# two as the axes it drives, and all four were read back before they
# became rows. m5 and m6 are absent because they describe themselves
# identically, which the header explains.

[[device]]
ref = "19bmHXP:m1"
name = "Sample X"
confirmed = true
group = "sample-stack"

[[device]]
ref = "19bmHXP:m2"
name = "Sample Y"
confirmed = true
group = "sample-stack"

[[device]]
ref = "19bmHXP:m3"
name = "Sample stage Z"
confirmed = true
group = "sample-stack"

[[device]]
ref = "19bmHXP:m4"
name = "Sample stage AX"
confirmed = true
group = "sample-stack"

[[device]]
ref = "19bmSoft:m23"
name = "Hexapod base Y"
confirmed = true
group = "sample-base"

[[device]]
ref = "19bmSoft:m1"
name = "White-beam slit outboard"
confirmed = true
group = "white-beam-slits"

[[device]]
ref = "19bmSoft:m2"
name = "White-beam slit top"
confirmed = true
group = "white-beam-slits"

[[device]]
ref = "19bmSoft:m3"
name = "White-beam slit inboard"
confirmed = true
group = "white-beam-slits"

[[device]]
ref = "19bmSoft:m4"
name = "White-beam slit bottom"
confirmed = true
group = "white-beam-slits"

[[device]]
ref = "19bmSoft:m5"
name = "Filter upstream"
confirmed = true
group = "filters"

[[device]]
ref = "19bmSoft:m6"
name = "Filter downstream"
confirmed = true
group = "filters"

[[device]]
ref = "19bmSoft:m9"
name = "Target X"
confirmed = true
group = "target"

[[device]]
ref = "19bmSoft:m10"
name = "Target Y"
confirmed = true
group = "target"

[[device]]
ref = "19bmSoft:m24"
name = "Optics X"
confirmed = true
group = "optics"

# Found by asking what a prefix fence of 19bmSoft:aero:m1 would also
# admit, which is a question about configuration and turned up a motor.
# The sweeps behind this file walked m1 through m24 and aero:m1, so the
# rest of the aero namespace was never looked at and this row was missed
# for as long as the register has existed. Nothing was wrong with the
# rule about which records are worth a row; the enumeration simply did
# not reach here. aero:m3 and up do not answer.

[[device]]
ref = "19bmSoft:aero:m2"
name = "Optics Z"
confirmed = true
group = "optics"

[[device]]
ref = "19bmSoft:m11"
name = "Optics Y"
confirmed = true
group = "optics"

[[device]]
ref = "19bmSoft:m17"
name = "High-magnification optics focus"
confirmed = true
group = "optics"

[[device]]
ref = "19bmSoft:m18"
name = "High-magnification optics rotation"
confirmed = true
group = "optics"

[[device]]
ref = "19bmSoft:m19"
name = "Low-magnification optics focus"
confirmed = true
group = "optics"

[[device]]
ref = "19bmSoft:m20"
name = "Low-magnification optics rotation"
confirmed = true
group = "optics"

# The centering pair is mounted and not wired, which the beamline said
# after these two rows were written. Both records answer and hold a
# position because a soft IOC serves them, and writing either moves
# nothing.
#
# The rows stay and so does the flag. confirmed says the sweep reached
# the record and it gave a role, which is still true and is the whole of
# what it ever claimed; whether a motor sits behind the role is a
# question it cannot carry and never could. Removing the rows would say
# the records are absent, which is also untrue.
#
# These are not the sample X and Y the acquisition software drives.
# Those sit under the rotary and move the assembly clear of the beam for
# flat fields; this pair sits on top and turns with it. The beamline
# warns against binding one to the other, because the names invite it
# and the images would be wrong before anything else complained.

[[device]]
ref = "19bmSoft:m21"
name = "Tomo centering at 0 degrees"
confirmed = true
group = "tomo-centering"

[[device]]
ref = "19bmSoft:m22"
name = "Tomo centering at 90 degrees"
confirmed = true
group = "tomo-centering"
