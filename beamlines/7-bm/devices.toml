# The 7-BM device register.
#
# Every row is one record the keeper will hold: where the control system
# publishes it, and this system's own label for it. Four keys and no
# others, one of them optional; beamlines/README.md says why the fields
# a beamline drawing would carry are not among them.
#
# The file names its beamline once, at the top, and it is the same word
# as the directory. A test compares the two, which is the only place in
# this system where two of the three copies of a beamline's name are
# ever checked against each other.
#
# group is which functional cluster a device belongs to here, and it is
# left out for a device that belongs to none. It is a value rows share
# rather than a thing that owns them: no nesting, no ordering, and
# nothing that can be said about a group rather than about a device.
#
# A ref is already in normal form here, and the loader refuses one that is
# not: trimmed, cut at the first '.', no trailing ':'.
#
# confirmed = true means the row was checked against the beamline. Rows
# start false and are promoted when staff or a caget sweep says so. It is
# not a defect to be false; it is a defect to be false and say true.
#
# ## Where these rows came from
#
# A caget sweep, by asking the acquisition software which records it
# drives. Its configuration records hold the names of other
# records, so the answer is record to record with nothing translated
# between one system's model and another's, and it returns a role rather
# than a position in a crate:
#
#     RotationPVName  ->  7bmb1:aero:m3
#     SampleXPVName   ->  7bmbHXP:m2
#     SampleYPVName   ->  7bmbHXP:m3
#
# Each was then read back and answered, which is what separates these
# from the placeholder strings the same question returns at 19-BM.
#
# A name here is authored and never copied from the facility's
# description field. Those fields are populated on this beamline and they
# describe a mechanism where this register wants a role: the rotation
# stage calls itself Sample Theta, and the two sample axes call
# themselves Hexapod X and Hexapod Y, which says what carries them rather
# than what they carry.
#
# ## What the sweep found and this file leaves out
#
# The detector, named as a prefix. A prefix is a namespace rather than a
# record, and the file plugin it writes through is named the same way.
# Neither can be written under the rule in beamlines/README.md, which is
# the same exclusion every other register here makes.
#
# ## The later sweep, and what shares this IOC
#
# The three rows above were all this register held until a sweep of the
# motor IOC, prompted by a controller at 32-ID that was serving optics no
# document named. Here it returned 58 answering records against three rows.
#
# Twelve were added: the rest of the hexapod, its base, a tomography
# centering pair, the three-axis optics stage and the lens and camera
# positioners of the detection optics.
#
# **Most of the rest belongs to other techniques on one IOC.** The sweep
# found KB mirror axes, a channel-cut monochromator, energy-dispersive
# diffraction, fluorescence detector translations, a chopper and a
# macroscope. They are real and current and none of them is something this
# system would drive, which is the scope rule beamlines/README.md states.
# Two channels reading Bad VME fail the older naming rule as well, and two
# more both read "Entrance M2X", so one of that pair could only be named by
# guessing.
#
# **Two records name the sample axes and have no motor behind them.**
# 7bmb1:aero:m1 and :m2 answer as Sample_Y and Sample_X, and their driver
# was commented out of the startup in March 2026 with the database load left
# in place. The scan server's own configuration still points at them, which
# is why this register points at the hexapod instead. They are left out
# because their role is already held by a live device, so registering them
# would put two devices on one role with nothing saying which moves.
#
# **The hexapod base moved group and not beamline.** 7bmb1:m26 was in
# sample-stack and is now in sample-base, which 2-BM and 32-ID gained at
# the same time. What stands under the stack is one motor here, a four-axis
# table at 2-BM and a six-axis one at 32-ID, so the group had to be named
# for what it is for rather than for the mechanism this beamline happens to
# have. Nothing about the device changed; the keeper holds a name and a
# reference and knows nothing of groups.

scheme = "epics-record"
beamline = "7-bm"

[[device]]
ref = "7bmb1:aero:m3"
name = "Sample rotation"
confirmed = true
group = "sample-stack"

