# The facility's operation register.
#
# An operation names a routine some engine already has. It is not a routine
# this system composes: apps/conductor/src/conductor/procedure.py draws the
# line, saying an operation's name is a handle in the engine's vocabulary
# while a procedure's steps are authored on this side and nothing outside
# knows what one is.
#
# Two fields. `define_operation` takes a name and a `parameters_schema`, and
# the keeper's Operation state carries no status because nothing retires one.
#
# The schema is required with no default, deliberately: the route says an
# operation whose parameters nobody has described is the state the aggregate
# exists to refuse. It is enforced rather than decorative, because
# `define_procedure` validates every run step's parameters against the schema
# of the operation that step names, so a procedure setting something this
# does not allow is rejected when it is written rather than when it is run.
#
# This file said "one field, because that is the whole aggregate" until a
# seeding run met the 422 that disproves it.
#
# ## Why this file is here and not in the four beamline directories
#
# An operation is one value for the whole facility, the way the inference
# profile in facility.toml is. The evidence is the record: the four beamlines
# that have dispatched a tomography scan all referenced one operation, so the
# per-beamline copy would have been four rows holding one fact.
#
# A procedure is the per-beamline thing, and it names an operation from here.
#
# ## Why the name is spelled this way
#
# Three layers want a name and only one of them is the product's.
#
#     adapters.toml   scan_engine = "tomoscan_engine"   which adapter drives
#     here            tomography_scan                   what is performed
#     procedures      "Tomography scan"                 this system's label
#
# So the name is not `tomoscan`. That word is the acquisition package, and it
# is already spent twice in each beamline's adapter table. Naming the
# operation after the software would say which program runs it in the one
# slot whose job is to say what is done, which is the rule the adapter table
# already states: keys name roles, not products.
#
# It is snake_case and holds no spaces, which the keeper would permit. The
# reason is that this string is matched rather than read. The conductor's
# tomoscan adapter is explicit that the name selects nothing and is instead
# checked against the set a deployment told it it may run, so a mistyped or
# unexpected operation becomes a refusal before anything is written. A token
# two configuration files must agree on character for character, one of them
# hand-edited on every beamline host, is harder to retype wrong without
# spaces or capitals in it.
#
# ## The agreement this file cannot check
#
# The name below has to equal the entry in `run.routines` in each
# conductor's own configuration, which lives on the beamline hosts and not
# in this repository. A mismatch refuses every dispatch at that beamline,
# correctly, for a reason no test here can see. Changing the name is
# therefore a coordinated edit and not a rename.
#
# ## What the record holds today and this file does not
#
# Three rows, which this file reduces to one.
#
# Two are named `tomo_scan` and differ only in id, because an operation is
# append-only and nothing refuses a second definition of one name. The newer
# carries the work; the older is referenced by a single step.
#
# The third is named `engineless probe`, and no engine answers to it. It was
# defined so that a conductor configured without an engine could be asked for
# something and refuse. That refusal comes from the conductor having no
# engine, not from the routine asked for, so the real operation proves it
# just as well and the facility's record is spared a routine that exists to
# fail.
#
# A row named `retrieve` is there too, from a seeding run while this file
# still carried it. It was the return leg written as a second engine bound
# to the reverse pair of collections. No engine ever answered
# to it, and the trip home it was for is a `move` from the computing
# facility's place to the beamline's.
#
# `transfer` is there for certain. It is the one-way move this file
# carried until `move` replaced it, and the two 19-BM procedures that named
# it are there with it. No conductor answers to it any longer, so either
# would wait forever if dispatched; they stay because nothing in the record
# is retired.
#
# `reconstruct` is there as well, with the two 19-BM procedures that named
# it. It was given a full filesystem path and carried its settings one by
# one on each step, and it wrote into a folder derived from the input's
# name, so nothing could say where a result was. `process` replaced it, and
# no conductor answers to it any longer, so either procedure would wait
# forever if dispatched.

# ## The schema is written in the keeper's subset, which is narrow
#
# A declared schema must name Draft 2020-12 in `$schema` and may use only
# `type`, `required`, `properties`, `enum`, `minimum`, `maximum`, `pattern`
# and `unit`. Anything else is refused as not well-formed, with a 400 that
# does not say which keyword offended.
#
# Two consequences are visible below. There is no `additionalProperties`,
# because the subset has no such keyword; extras are allowed by the schema
# default, which is what this register wants anyway. The engine adapter
# writes each parameter as a record under the scan server's prefix, so any
# setting that server accepts is legal, and forbidding extras would put this
# file rather than the beamline in charge of what a scan may set. And a lower
# bound is `minimum` rather than `exclusiveMinimum`, which is also absent.
#
# The two settings below are required because a scan that leaves them unset
# inherits whatever the last one left in the IOC.
#
# `unit` is the keeper's own three-field annotation, not a JSON Schema
# keyword: a system from its allowlist, a code, and an optional label.

[[operation]]
name = "tomography_scan"

[operation.parameters_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["NumAngles", "ExposureTime"]

[operation.parameters_schema.properties.NumAngles]
type = "integer"
minimum = 1

[operation.parameters_schema.properties.ExposureTime]
type = "number"
minimum = 0

[operation.parameters_schema.properties.ExposureTime.unit]
system = "udunits"
code = "s"
label = "seconds"

# ## Moving data between places
#
# Moving data is performed by an engine the way taking data is: a
# conductor is asked for it by name, hands it parameters and hears how it
# went. So it belongs here rather than in some other register of things
# that are not scans.
#
# A step names no collection, because a procedure able to name its own
# endpoints could move a beamline's data anywhere while reading like any
# other step. It names places instead, each a name the facility gives
# somewhere data can be, and what a name leads to, a collection and a root
# folder on it, is set in the conductor's own settings beside the routes it
# may move along. So a procedure chooses among moves somebody installed and
# cannot add one, and one engine serves every hop. What tells two hops
# apart is the pair of places each step names: a round trip is two steps
# of this operation, and a chain through four facilities is four.
#
# `path` is where the data sits inside the place it leaves, relative to
# that place's root, and it lands at the same relative path inside the
# place it reaches, so one path names the data at every stop. Ending in a
# slash means a folder and everything under it, which is what a
# reconstruction is. The pattern refuses only a leading slash; the engine
# refuses the rest of what could climb out of a place. It is a path and not
# a dataset id, because what a move is given is what the engine that made
# the data announced, and custody, not the step, says which datasets those
# bytes were.
#
# `from` and `to` enumerate the facility's places, and the list is a
# facility fact for the reason operation names are: a place spelled two
# ways would be two places, and the keeper refusing a name it does not
# list turns a misspelling into a refused procedure rather than a refused
# move.
#
# The list is also frozen. The keeper keeps the schema an operation was
# defined with, so a third place is not an edit here: it is a second
# definition of `move`, and then a decision about which of the two every
# procedure naming the word means. `process` below names its place by a
# pattern for that reason, and leaves an unknown place to the engine.


[[operation]]
name = "move"

[operation.parameters_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["path", "from", "to"]

[operation.parameters_schema.properties.path]
type = "string"
pattern = "^[^/]"

[operation.parameters_schema.properties.from]
type = "string"
enum = ["19-bm", "alcf"]

[operation.parameters_schema.properties.to]
type = "string"
enum = ["19-bm", "alcf"]

# ## Processing data where it sits
#
# Processing is performed by an engine at a computing facility, asked for
# by name like the others. A step names four things: which configuration,
# at which place, what input and what output.
#
# `config` names a set of settings a deployment holds rather than carrying
# them, so a hundred runs with one setup repeat nothing and the record
# says which setup each used. The configurations a beamline's processor
# holds are in its own directory, in processing.toml, which is what the
# conductor there is handed. `override` is a table of settings written
# over the configuration's for one run, and the engine refuses a key the
# configuration does not hold: a misspelt setting is caught before it is
# submitted, and every setting a run used is written down in some
# configuration. The keeper's subset cannot say what keys a table may
# carry, so beamlines/tests says it for the rows here.
#
# `at` is a place in the sense `move` uses, and `input` is a path inside
# it, so the input is the path a move landed. `output` is a folder in the
# same place and ends in a slash, because a run writes many files and a
# log beside them. Both paths start below the place's root, as a move's
# does, and the engine refuses whatever else could climb out of it.
#
# `config` and `at` are patterns and not lists, for the reason given
# above: a list here would be frozen into the operation, and the next
# configuration or place would need a second definition. The engine
# refuses a name its deployment does not hold, before submitting anything.
#
# It replaced `reconstruct`, which the note near the top of this file
# accounts for.

[[operation]]
name = "process"

[operation.parameters_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["config", "at", "input", "output"]

[operation.parameters_schema.properties.config]
type = "string"
pattern = "^[a-z0-9][a-z0-9-]*$"

[operation.parameters_schema.properties.at]
type = "string"
pattern = "^[a-z0-9][a-z0-9-]*$"

[operation.parameters_schema.properties.input]
type = "string"
pattern = "^[^/]"

[operation.parameters_schema.properties.output]
type = "string"
pattern = "^[^/].*/$"

[operation.parameters_schema.properties.override]
type = "object"
