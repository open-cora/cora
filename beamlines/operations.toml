# The facility's operation register.
#
# An operation names a routine some engine already has. It is not a routine
# this system composes: apps/conductor/src/conductor/procedure.py draws the
# line, saying an operation's name is a handle in the engine's vocabulary
# while a procedure's steps are authored on this side and nothing outside
# knows what one is.
#
# Two fields. `define_operation` takes a name and a `parameters_schema`, and
# the keeper's Operation state carries no status because nothing retires one.
#
# The schema is required with no default, deliberately: the route says an
# operation whose parameters nobody has described is the state the aggregate
# exists to refuse. It is enforced rather than decorative, because
# `define_procedure` validates every run step's parameters against the schema
# of the operation that step names, so a procedure setting something this
# does not allow is rejected when it is written rather than when it is run.
#
# This file said "one field, because that is the whole aggregate" until a
# seeding run met the 422 that disproves it.
#
# ## Why this file is here and not in the four beamline directories
#
# An operation is one value for the whole facility, the way the inference
# profile in facility.toml is. The evidence is the record: the four beamlines
# that have dispatched a tomography scan all referenced one operation, so the
# per-beamline copy would have been four rows holding one fact.
#
# A procedure is the per-beamline thing, and it names an operation from here.
#
# ## Why the name is spelled this way
#
# Three layers want a name and only one of them is the product's.
#
#     adapters.toml   scan_engine = "tomoscan_engine"   which adapter drives
#     here            tomography_scan                   what is performed
#     procedures      "Tomography scan"                 this system's label
#
# So the name is not `tomoscan`. That word is the acquisition package, and it
# is already spent twice in each beamline's adapter table. Naming the
# operation after the software would say which program runs it in the one
# slot whose job is to say what is done, which is the rule the adapter table
# already states: keys name roles, not products.
#
# It is snake_case and holds no spaces, which the keeper would permit. The
# reason is that this string is matched rather than read. The conductor's
# tomoscan adapter is explicit that the name selects nothing and is instead
# checked against the set a deployment told it it may run, so a mistyped or
# unexpected operation becomes a refusal before anything is written. A token
# two configuration files must agree on character for character, one of them
# hand-edited on every beamline host, is harder to retype wrong without
# spaces or capitals in it.
#
# ## The agreement this file cannot check
#
# The name below has to equal the entry in `run.routines` in each
# conductor's own configuration, which lives on the beamline hosts and not
# in this repository. A mismatch refuses every dispatch at that beamline,
# correctly, for a reason no test here can see. Changing the name is
# therefore a coordinated edit and not a rename.
#
# ## What the record holds today and this file does not
#
# Three rows, which this file reduces to one.
#
# Two are named `tomo_scan` and differ only in id, because an operation is
# append-only and nothing refuses a second definition of one name. The newer
# carries the work; the older is referenced by a single step.
#
# The third is named `engineless probe`, and no engine answers to it. It was
# defined so that a conductor configured without an engine could be asked for
# something and refuse. That refusal comes from the conductor having no
# engine, not from the routine asked for, so the real operation proves it
# just as well and the facility's record is spared a routine that exists to
# fail.

# ## The schema is written in the keeper's subset, which is narrow
#
# A declared schema must name Draft 2020-12 in `$schema` and may use only
# `type`, `required`, `properties`, `enum`, `minimum`, `maximum`, `pattern`
# and `unit`. Anything else is refused as not well-formed, with a 400 that
# does not say which keyword offended.
#
# Two consequences are visible below. There is no `additionalProperties`,
# because the subset has no such keyword; extras are allowed by the schema
# default, which is what this register wants anyway. The engine adapter
# writes each parameter as a record under the scan server's prefix, so any
# setting that server accepts is legal, and forbidding extras would put this
# file rather than the beamline in charge of what a scan may set. And a lower
# bound is `minimum` rather than `exclusiveMinimum`, which is also absent.
#
# The two settings below are required because a scan that leaves them unset
# inherits whatever the last one left in the IOC.
#
# `unit` is the keeper's own three-field annotation, not a JSON Schema
# keyword: a system from its allowlist, a code, and an optional label.

[[operation]]
name = "tomography_scan"

[operation.parameters_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["NumAngles", "ExposureTime"]

[operation.parameters_schema.properties.NumAngles]
type = "integer"
minimum = 1

[operation.parameters_schema.properties.ExposureTime]
type = "number"
minimum = 0

[operation.parameters_schema.properties.ExposureTime.unit]
system = "udunits"
code = "s"
label = "seconds"

# ## The second operation, and why it is not a scan
#
# An operation names what is performed, and moving a file is performed by
# an engine the same way taking data is: a conductor is asked for it by
# name, hands it parameters and hears how it went. So it belongs here
# rather than in some other register of things that are not scans.
#
# It is one value for the facility for the same reason the first is. Which
# collections a transfer runs between is a deployment's fact and is not
# here: the engine takes them from its own environment and refuses to take
# them from a step, because a procedure able to name its own endpoints
# could move a beamline's data anywhere while reading like any other step.
#
# So the only parameter is what to move. One file and not a directory: a
# step that moved whatever a directory held would move a different set
# depending on when it ran, and the record would say it had moved the same
# thing both times.
#
# `source_path` is a path and not a dataset id on purpose. What a transfer
# is given is what the engine that made it announced, which is a file name
# on a collection, and translating that into something this system holds
# and back again would be two more places for the two to disagree.

[[operation]]
name = "transfer"

[operation.parameters_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["source_path"]

[operation.parameters_schema.properties.source_path]
type = "string"
pattern = "^/"

# ## The third operation, and where its settings come from
#
# Reconstructing a dataset is performed somewhere else, by a facility that
# has the hardware for it, and a conductor is asked for it by name and
# hears how it went. So it belongs here beside the other two.
#
# The split between what is below and what is not is the one the second
# operation draws, applied to a larger pile of settings.
#
# Not here: which compute endpoint, under which project, in which queue,
# on how many nodes, in which container, and which directories are bound
# into it. Those are a deployment's facts and the engine takes them from
# its own environment. A step able to name its own node count could spend
# an allocation while reading like any other step, which is the same
# hazard as a step able to name its own collections.
#
# Here: what to reconstruct, and the science. A reconstruction's rotation
# axis and the beam's energy are decisions about this dataset, not about
# the machine it runs on, and leaving them to a file on a host would mean
# a record that says a reconstruction happened without saying what was
# asked for. That is the reason `tomography_scan` carries NumAngles and
# ExposureTime rather than inheriting them, written out one layer up.
#
# The six below are declared and the rest are not, which is not a fence.
# The keeper's subset has no `additionalProperties`, so a step may carry
# any other setting the far side accepts and the engine hands it through.
# These six are the ones worth validating: each has a unit or a bound,
# and each is one a typo would carry all the way to a quietly wrong
# reconstruction rather than to an error.
#
# They are spelled with hyphens because that is what the reconstruction
# software calls them, and renaming them here would put this file in
# charge of a vocabulary it does not own.

[[operation]]
name = "reconstruct"

[operation.parameters_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["source_path"]

[operation.parameters_schema.properties.source_path]
type = "string"
pattern = "^/"

# In pixels, along the detector row. No bound: it is a position on a
# detector whose width this file does not know, and a wrong one is
# visibly wrong in the result rather than out of range.
[operation.parameters_schema.properties."rotation-axis"]
type = "number"

[operation.parameters_schema.properties.energy]
type = "number"
minimum = 0

[operation.parameters_schema.properties.energy.unit]
system = "udunits"
code = "keV"
label = "kiloelectronvolts"

[operation.parameters_schema.properties."pixel-size"]
type = "number"
minimum = 0

[operation.parameters_schema.properties."pixel-size".unit]
system = "udunits"
code = "um"
label = "micrometres"

[operation.parameters_schema.properties."propagation-distance"]
type = "number"
minimum = 0

[operation.parameters_schema.properties."propagation-distance".unit]
system = "udunits"
code = "mm"
label = "millimetres"

# Zero means none. It is a power of two exponent rather than a factor,
# which is why one is as meaningful a value as eight would not be.
[operation.parameters_schema.properties.binning]
type = "integer"
minimum = 0

# ## The fourth operation, and why moving a file needs two of them
#
# An engine is given its source collection and its destination
# collection when it is built, and a step may name neither. That is the
# rule the second operation above is written around: a procedure able to
# name its own endpoints could move a beamline's data anywhere while
# reading like any other step.
#
# The price of that rule is that an engine moves files one way. So the
# trip home is not `transfer` with the arguments reversed, because there
# are no arguments to reverse; it is a second engine, bound to the
# reverse pair, answering to a second routine. A second routine needs a
# row here, which is this one.
#
# The schema is the second operation's, unchanged and deliberately not
# merged with it. Two operations that happen to validate the same way
# are still two operations, and a shared schema would say they were one
# thing that had a direction, which is the reading this register exists
# to refuse.
#
# What `source_path` holds here is a path on the collection the results
# were computed onto, not the one the beamline reads. Where it lands is
# the engine's `CORA_RETRIEVE_PREFIX`, which is a deployment's fact for
# the same reason the outbound prefix is.

[[operation]]
name = "retrieve"

[operation.parameters_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["source_path"]

[operation.parameters_schema.properties.source_path]
type = "string"
pattern = "^/"
