# The 2-BM device register.
#
# Every row is one record the keeper will hold: where the control system
# publishes it, and this system's own label for it. Four keys and no
# others, one of them optional; beamlines/README.md says why the fields
# a beamline drawing would carry are not among them.
#
# The file names its beamline once, at the top, and it is the same word
# as the directory. A test compares the two, which is the only place in
# this system where two of the three copies of a beamline's name are
# ever checked against each other.
#
# group is which functional cluster a device belongs to here, and it is
# left out for a device that belongs to none. It is a value rows share
# rather than a thing that owns them: no nesting, no ordering, and
# nothing that can be said about a group rather than about a device.
#
# A ref is already in normal form here, and the loader refuses one that is
# not: trimmed, cut at the first '.', no trailing ':'. So 2bmb:m1.RBV is
# written 2bmb:m1, and 2bmb:m1 and 2bmb:m10 are two motors.
#
# confirmed = true means the row was checked against the beamline. Rows
# start false and are promoted when staff or a caget sweep says so. It is
# not a defect to be false; it is a defect to be false and say true.
#
# ## Where these rows came from
#
# A caget sweep against 2-BM's own IOCs, read out of the acquisition
# software's own configuration rather than assembled by hand. The three
# records below are what it names as the axes it drives, so the roles are
# the beamline's own account of them and not an inference from a motor
# number. Every row is therefore confirmed.
#
# A name here is still authored, never copied from the facility's
# description field. Those fields are populated at 2-BM and they describe
# a mechanism where this register wants a role: the rotation stage
# describes itself as "Rotation" and the two hexapod axes as "Hexapod X"
# and "Hexapod Y", which does not say which of them carries the sample.
#
# ## What the sweep found and this file leaves out
#
# **The detector.** The acquisition software names it as a prefix, and a
# prefix is a namespace rather than a record: asking for that string alone
# finds nothing, while the records beneath it answer. The rule in
# beamlines/README.md is that a reference is never a namespace, so there is
# no honest way to write the detector here today. It is not a defect in
# the software that named it, which is describing an interface that really
# is a namespace of many records. It is this register modelling only one of
# the two shapes the rest of this tree already distinguishes.
#
# **The safety-system records.** The acquisition software also reads a
# shutter state and a front-end permit. Both are served by a facility
# system rather than by this beamline, so the beamline reads them and does
# not own them. A register of what a beamline has is the wrong home for
# them.
#
# ## The later sweep, and the scope rule it forced
#
# The three rows above were all this register held until a sweep of the
# motor IOC itself. That sweep happened because a whole controller at 32-ID
# turned out to be serving optics no document named, and the same question
# asked here returned 81 answering records against three rows, 75 on the
# motor IOC and 6 on the hexapod. That figure stood here as "about 86" for
# a while, from a count taken before the sweep was scripted. The number
# above was measured by asking twice, once for a readback and once for a
# description, because a record answering with a blank description would
# be counted by one question and not the other. None here is blank.
#
# Sixteen were added: the rest of the hexapod, a tomography centering pair
# reading 0/180 and 90/270, the alignment tilts, the lens and camera
# selectors of the detection optics, and the scintillator. Each answered
# with a role.
#
# **Most of what answered is deliberately absent, and the reason is a rule
# rather than fatigue.** Some fails the naming test this directory already
# applies: six channels read Bad VME CH, Broken Channel, not connected or a
# row of dashes, and fifteen more read "motor 63" and its like, which names
# a channel and not a thing.
#
# The rest fails a second test, which 19-BM never needed and
# beamlines/README.md now states. This beamline's motor space accumulated
# over decades, and a sweep of it returns a furnace, a tumbler, two cameras
# discontinued a hardware generation apart, five axes of an old table and a
# laminography stage. Every one of those has a name a reader would trust and
# none is something this system would drive. confirmed says the sweep
# reached a record and it gave a role, never that hardware is behind it, so
# writing them down would make this an inventory of the control system's
# memory rather than of the beamline.
#
# **Four records claim the sample translation role and only one is here.**
# Besides the hexapod axes the software names, the sweep found Tomo X,
# Tomo Y, Tomo_Sam_Y and an Old Tomo_Sam_Y. Which of them still moves a
# sample is not a question the sweep can answer, and registering all four
# would put four candidates for one role in the record with nothing saying
# which. The software's own answer is the hexapod, so the hexapod is what
# this file holds.
#
# ## The table the hexapod stands on
#
# The last four rows are the sample table, and they are here because a
# comparison across the four registers found them missing rather than
# because a survey of this beamline did. 7-BM and 19-BM both register a
# single axis their beamlines call Hexapod_Base_Y, and a register that held
# what the sample stack stands on at two beamlines and not at the other two
# would describe a difference in the hardware that is not there. That is
# the same argument that put 32-ID's detection optics in its register.
#
# What stands under the stack is not the same mechanism at every beamline,
# which is why the group is sample-base rather than a hexapod word. Here it
# is a four-axis table reading Sample table USX, DSX, Z and Y. At 32-ID it
# is a six-axis one. At the other two it is one motor. The group says what
# the thing is for; the names say what each beamline actually has.
#
# These four are not the old table this file already excludes. That one
# answers as OLD Table US Y OB, OLD Table DS X, OLD Table US Y IB and NOT
# USED Table US Y IB, and says so in its own description fields. These say
# Sample table and nothing else.

scheme = "epics-record"
beamline = "2-bm"

[[device]]
ref = "2bmb:m102"
name = "Sample rotation"
confirmed = true
group = "sample-stack"

