# The 32-ID device register.
#
# Every row is one record the keeper will hold: where the control system
# publishes it, and this system's own label for it. Four keys and no
# others, one of them optional; beamlines/README.md says why the fields
# a beamline drawing would carry are not among them.
#
# The file names its beamline once, at the top, and it is the same word
# as the directory. A test compares the two, which is the only place in
# this system where two of the three copies of a beamline's name are
# ever checked against each other.
#
# group is which functional cluster a device belongs to here, and it is
# left out for a device that belongs to none. It is a value rows share
# rather than a thing that owns them: no nesting, no ordering, and
# nothing that can be said about a group rather than about a device.
#
# A ref is already in normal form here, and the loader refuses one that is
# not: trimmed, cut at the first '.', no trailing ':'. So 32idc02:m39.RBV
# is written 32idc02:m39, and 32idc02:m3 and 32idc02:m39 are two motors.
#
# confirmed = true means the row was checked against the beamline. Rows
# start false and are promoted when staff or a caget sweep says so. It is
# not a defect to be false; it is a defect to be false and say true.
#
# ## Two instruments, and which rows belong to which
#
# 32-ID runs four instruments and two of them are here: the micro-tomography
# station and the transmission X-ray microscope. They are not two names for
# one thing. They have separate scan servers, separate optics servers and
# separate sample stacks, and upstream tomoscan carries a class for each.
#
# The instrument is carried in a device's name rather than in a field of its
# own. That is the partition beamlines/EXPANSION.md settled on, and it works
# because a name is this system's own label: it can say which instrument
# without asking a keeper command to accept a column it does not have.
#
# **The micro-tomography rows are not prefixed, and that is not an oversight.**
# A device's name is fixed when it is registered. The keeper has register,
# retire, fault and recover and no rename, and beamlines/seed_devices.py
# derives its idempotency key from the reference alone, so editing a name here
# cannot reach a device already registered under the old one. These five
# predate the TXM rows. Renaming them would make this file say one thing where
# the record says another, with no command able to reconcile the two. So an
# unprefixed name at 32-ID means the micro-tomography station, and the day
# nothing is registered under these references is the day the prefix becomes
# free to add.
#
# ## Where the micro-tomography rows came from
#
# A caget sweep against 32-ID's own IOCs. The rows were drafted from that
# instrument's own manual, which the facility spells micro-CT, and every one
# of them has since been checked against the hardware, so all five are
# confirmed.
#
# Three of the five were confirmed the way 2-BM's were, by asking the
# acquisition software which records it drives. Its configuration records
# hold the names of other records, so the answer is record to record with
# nothing translated between one system's model and another's, and it
# returns a role rather than a position in a crate:
#
#     RotationPVName  ->  32idcSoft:ens:c1:m1
#     SampleXPVName   ->  32idc02:m39
#     SampleYPVName   ->  32idc02:m23
#
# The two tilts rest on different evidence, and the difference is worth
# keeping. The acquisition software does not name them, so what the sweep
# checked is that each record exists and answers. Their names here were
# authored from the manual, which describes both as alignment tilts, and
# the facility's own page for this instrument has since given the same two
# roles, pitch alignment and roll alignment. So the names are corroborated
# where the other three are derived, which is a weaker thing and not the
# same as unsupported.
#
# A name is never copied from the facility's description field. Those
# fields are populated here and they describe a mechanism where this
# register wants a role: the two tilts describe themselves as Tomo_Pitch
# and Tomo_Roll, which says how they are wired rather than what they are
# for.
#
# ## Where the TXM rows came from
#
# A read-only caget sweep of this instrument's motor IOC, which is the same
# standard the two tilts above meet: each record was reached, answered, and
# gave a role.
#
#     32idbTXM:ens:c1:m1          Rotation
#     32idbTXM:mcs:c2:m1          Sample Top X
#     32idbTXM:mcs:c2:m2          Sample Top Z
#     32idbTXM:uniblitz:control   answers, reads Close
#
# The optics came from the same sweep and sit on a second SmarAct controller,
# mcs2, which no facility page mentions. Probing only mcs returned nothing
# and read exactly like an instrument with no optics; the controller was
# found by reading the IOC's own record dump rather than by guessing further
# channel names. Condenser, zone plate, pinhole, diffuser, beamstop, beam
# position monitor, scintillator, a second sample top pair and the camera
# rotation all answered with roles, which is why they are rows.
#
# Two of their names are the beamline's own words rather than this system's
# preference. "new" on the second sample top pair is how the beamline
# distinguishes it from the pair above, and which of the two carries the
# sample is the open question already stated. "granite" on the sample X
# below the rotary is what separates it from the sample top X on it, which
# is a distinction the beamline's own documentation warns against losing.
#
# **Not record to record, because that instrument's scan server is down.**
# It serves RotationPVName and the rest as records, so the stronger question
# could have been asked of it, and the sibling station answered the same
# question in the same minute. This one did not answer at all.
#
# That matters because the weaker evidence is the only evidence here, and it
# cannot say which record a scan would drive. The names below are roles the
# hardware gave, not bindings a server confirmed.
#
# **There are two sample top pairs and this register holds the older one.**
# 32idbTXM:mcs2:c4:m1 and :m2 answer as Sample Top X(new) and Sample Top
# Z(new), on a second controller, holding a different position from the pair
# below. The scan server's configuration names the pair below. Which one
# carries the sample today is a question neither the sweep nor the file can
# settle, and it is the question to put to the beamline before anything
# drives either.
#
# An earlier version of these rows was authored from the scan server's
# substitutions file rather than from the beamline, and called the second
# one TXM sample Y. The hardware calls it Z. That file names the pair as
# both SAMPLE_X/SAMPLE_Y and SAMPLE_TOP_X/SAMPLE_TOP_Z, and reading the
# first spelling is how an axis changed letter on the way into this file.
#
# ## What the manual names and this file leaves out
#
# **The detector.** The sweep asked the acquisition software for its
# camera and got back a bare prefix, ending in a namespace separator and
# naming no record. So the exclusion 2-BM makes applies here on this
# beamline's own evidence rather than by carrying over that one: the
# software names an interface that really is a namespace of many records,
# and this register holds only one of the two shapes the rest of the tree
# distinguishes. The file plugin it writes through came back the same way.
# The TXM's camera is the same shape where it is named: a prefix, its file
# plugin and its PVA plugin, and not one of the three is a record.
#
# It is worth saying plainly that nothing enforces this.
# normalize_reference returns a bare name for a trailing-colon prefix
# rather than refusing one, so the loader would accept either of those
# answers as a record. The rule in beamlines/README.md is the only thing
# standing between this file and a row that names a namespace.
#
# **Five TXM records answered and are deliberately absent**, on the rule
# 19-BM's register states: a row whose name would have to be invented is the
# guessing this directory exists to avoid.
#
#     32idbTXM:mcs:c2:m3     NC, which is the spare case
#     32idbTXM:nf:m2         nf 2, a controller and a channel
#     32idbTXM:nf:m3         nf 3, the same
#     32idbTXM:mcs2:c3:m1    Phase ring 1
#     32idbTXM:mcs2:c3:m2    Phase ring 1, the same label on a second axis
#
# The phase ring pair is the interesting one. Both axes answer, hold
# different positions and are plainly two mechanisms, but the beamline labels
# them identically, so one of the two names could only be guessed. That is a
# defect in their configuration worth reporting rather than a reason to
# invent a name here. The sweep saw all five and decided, which is recorded
# so a later reader does not wonder whether it missed them.
#
# **The axis that drives nothing**, which is 32idc02:m7. The optics server
# will not start without a sample Z record and this stack has no Z
# translation, so an unused channel was given the name and wired to nothing.
# A register of what a beamline has is the wrong home for a record that
# exists to satisfy a startup check, and registering it would let a
# procedure claim and set something guaranteed to do nothing. Its
# engineering unit is still degrees, left over from an earlier assignment,
# which is a second reason not to carry it.
#
# The vertical axis of this stack is 32idc02:m23 and it is registered above
# as sample Y. The two are easy to confuse and an earlier version of this
# comment did, calling the dead record the vertical one.
#
# The neighbouring channel 32idc02:m6 looks equally unused and is not. The
# beamline's own page warns that it is a real connected axis of the tomo
# table despite its label, so the absence of m6 here is also deliberate.
#
# ## The micro-tomography optics, added for consistency
#
# The last eight rows are this station's detection optics: a lens selector,
# three lens focus axes, a camera selector, two camera rotations and the
# vertical of the whole assembly. They are driven by an optics server rather
# than by the scan engine, which is why the first survey of this beamline
# never saw them: it asked the acquisition software what it drives.
#
# They are here because the same set exists at 2-BM and is registered there,
# and a register that held one and not the other would describe a difference
# between the two beamlines that does not exist.

